services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_root_only
      MYSQL_DATABASE: returnly
      MYSQL_USER: returnly
      MYSQL_PASSWORD: returnly_local_only
    ports: ['127.0.0.1:3307:3306']
    volumes: ['mysql_data:/var/lib/mysql']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 30
  mongo:
    image: mongo:8.0
    ports: ['127.0.0.1:27018:27017']
    volumes: ['mongo_data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
  mongo_data:
