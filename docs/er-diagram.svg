<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="1370" viewBox="0 0 1430 1370" role="img" aria-labelledby="title desc">
<title id="title">Returnly entity relationship diagram</title>
<desc id="desc">MySQL tables and cardinalities for buyers, vendors, orders, payments, disputes, refunds, sessions, audit events and outbox records. MongoDB holds message and evidence documents linked by dispute UUID.</desc>
